<!DOCTYPE html>
<html lang="en">
<head>

<!-- =========================================================
     ===== BASIC META =========================================
     ========================================================= -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>KHIDMAT-E-KHALQ OFFICE</title>

<!-- =========================================================
     ===== FONT AWESOME =======================================
     ========================================================= -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

 <!-- =========================================================
     ===== MAIN CSS : START ==================================
     ========================================================= -->

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222;overflow-x:hidden}
button,input{font-family:inherit}

.header{background:linear-gradient(135deg,#0756c9,#0047b3);min-height:105px;padding:8px 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}

.logo{width:65px;height:65px;border-radius:50%;object-fit:cover;background:#fff;flex-shrink:0;align-self:flex-start;margin-top:-5px}
.header .logo:first-child{transform:translate(-2px,5px)}
.header .logo:last-child{transform:translate(2px,5px)}
     
.header-center{text-align:center;flex:1;min-width:0}
.header-center .name{font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:8px;transform:translateY(-10px)}
.header-center h1{font-size:19px;line-height:1.2;font-weight:800;white-space:nowrap;transform:translateY(-7px)}

.main-intro{text-align:center;padding:20px 18px 15px;background:#fff}
.main-intro h2{font-size:22px;color:#0758c9;font-weight:800;margin-bottom:10px;line-height:1.15}
.main-intro p{font-size:15px;font-weight:600;color:#222;letter-spacing:.3px}

.search-box{margin:24px auto 20px;width:99%;max-width:700px}
.search-box input{width:100%;height:50px;border:2px solid #0758c9;border-radius:12px;padding:0 22px;font-size:18px;font-weight:400;outline:none}
.search-box input::placeholder{color:#777}

.total-services{font-size:18px;font-weight:700;margin-top:4px}
.total-services span{font-weight:400}

.aadhaar-section{background:#eef5fd;padding:32px 18px 30px}   
.aadhaar-toggle{width:100%;max-width:700px;margin:0 auto;background:linear-gradient(145deg,#f8fbff,#edf5fc);border:0;border-top:7px solid #ff9d35;border-radius:17px;min-height:150px;padding:10px 20px;display:flex;align-items:flex-start;gap:18px;text-align:left;box-shadow:0 12px 28px rgba(0,82,204,.12);cursor:pointer}
.aadhaar-icon{width:64px;height:60px;border-radius:14px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:37px;box-shadow:0 8px 22px rgba(0,82,204,.08);flex-shrink:0;transform:translateY(0px)}

.aadhaar-text{flex:1;transform:translateY(10px)}
.aadhaar-text h3{font-size:17px;color:#0758c9;margin-bottom:10px}
.aadhaar-text p{font-size:13px;color:#555;font-weight:600}

.aadhaar-arrow{font-size:32px;color:#0758c9;font-weight:800}

@media(max-width:600px){

.header{min-height:105px;padding:8px 8px 12px}
.logo{width:65px;height:65px}
.header-center .name{font-size:12px;margin-bottom:8px;transform:translateY(-10px)}
.header-center h1{font-size:19px;white-space:nowrap;transform:translateY(-7px)}

.main-intro{padding:20px 18px 15px}
.main-intro h2{font-size:22px;line-height:1.15}
.main-intro p{font-size:15px}

.search-box{margin:24px auto 20px;width:99%}
.search-box input{height:50px;font-size:18px;border-radius:12px}

.total-services{font-size:18px}

.aadhaar-section{padding:32px 18px 30px}
.aadhaar-toggle{width:100%;min-height:150px;padding:10px 16px;border-radius:17px;gap:16px}

.aadhaar-icon{width:64px;height:60px;font-size:37px;transform:translateY(0px)}  
.aadhaar-text{transform:translateY(10px)}  
.aadhaar-text h3{font-size:17px}  
.aadhaar-text p{font-size:13px}  
.aadhaar-arrow{font-size:32px}  
.mobile-service{display:none;padding:0 18px 30px;background:#eef5fd}  
.mobile-service-btn{width:100%;max-width:630px;height:86px;margin:0 auto;background:#fff;border:0;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;gap:8px;color:#0758c9;font-size:19px;font-weight:800;cursor:pointer}  
}  
</style>

<!-- =========================================================
     ===== MAIN CSS : END ====================================
     ========================================================= -->
     
</head>
<body>

<!-- =========================================================
     ===== HEADER : START ====================================
     ========================================================= -->

<header class="header">

<img
src="Gemini_Generated_Image_vhcb6hvhcb6hvhcb.png"
alt="Yasir Saeed Logo"
class="logo">

<div class="header-center">
<div class="name">YASIR SAEED</div>
<h1>KHIDMAT-E-KHALQ OFFICE</h1>
</div>

<img
src="Gemini_Generated_Image_ngqq51ngqq51ngqq.png"
alt="Khidmat-E-Khalq Office Logo"
class="logo">

</header>

<!-- =========================================================
     ===== HEADER : END ======================================
     ========================================================= -->


<!-- =========================================================
     ===== MAIN SERVICE INTRO : START ========================
     ========================================================= -->

<section class="main-intro">

<h2>Digital Services Portal</h2>

<p>Fast • Secure • Professional</p>

<div class="search-box">
<input
type="search"
id="serviceSearch"
placeholder="Search Aadhaar Service..."
autocomplete="off">
</div>

<div class="total-services">
Total Services : <span>8</span>
</div>

</section>

<!-- =========================================================
     ===== MAIN SERVICE INTRO : END ==========================
     ========================================================= -->


<!-- =========================================================
     ===== AADHAAR PVC CARD BUTTON : START ===================
     ========================================================= -->

<section class="aadhaar-section">

<button
type="button"
class="aadhaar-toggle"
id="aadhaarServicesButton">

<div class="aadhaar-icon">🪪</div>

<div class="aadhaar-text">
<h3>Aadhaar Services</h3>
<p>8 Services Available</p>
</div>

<div class="aadhaar-arrow">⌄</div>

</button>

</section>

<!-- =========================================================
     ===== AADHAAR PVC CARD BUTTON : END =====================
     ========================================================= -->

<!-- =========================================================
     ===== MOBILE NUMBER UPDATE : START =====================
     ========================================================= -->

<section class="mobile-service" id="mobileService">
<button type="button" class="mobile-service-btn">📱 Mobile Number Update</button>
</section>

<!-- =========================================================
     ===== MOBILE NUMBER UPDATE : END =======================
     ========================================================= -->
