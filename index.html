<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>KHIDMAT-E-KHALQ OFFICE</title>

<!-- =========================================================
     ===== FONT AWESOME ======================================
     ========================================================= -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- =========================================================
     ===== MAIN CSS : START ==================================
     ========================================================= -->

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f9ff;
    color:#222;
    overflow-x:hidden;
}

button,
input,
select{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

img{
    max-width:100%;
    display:block;
}

/* =========================================================
   ===== HEADER =============================================
   ========================================================= */

.header{
    width:100%;
    background:linear-gradient(135deg,#0050c9,#0044ad);
    min-height:174px;
    padding:12px 18px 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 5px 18px rgba(0,0,0,.16);
}

.header-logo{
    width:108px;
    height:108px;
    border-radius:50%;
    object-fit:cover;
    background:#fff;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
    flex-shrink:0;
}

.header-center{
    flex:1;
    text-align:center;
    padding:0 8px;
}

.header-name{
    color:#fff;
    font-size:19px;
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:13px;
}

.header-title{
    color:#fff;
    font-size:31px;
    line-height:1.15;
    font-weight:800;
    white-space:nowrap;
}

/* =========================================================
   ===== MAIN SERVICE INTRO =================================
   ========================================================= */

.main-intro{
    background:#fff;
    text-align:center;
    padding:26px 15px 22px;
}

.main-intro h1{
    color:#0052cc;
    font-size:40px;
    line-height:1.15;
    font-weight:800;
    margin-bottom:16px;
}

.main-intro p{
    color:#222;
    font-size:27px;
    font-weight:500;
    letter-spacing:.3px;
    margin-bottom:34px;
}

/* =========================================================
   ===== SEARCH =============================================
   ========================================================= */

.search-wrapper{
    width:100%;
    max-width:650px;
    margin:0 auto;
}

#serviceSearch{
    width:100%;
    height:88px;
    border:3px solid #0060c9;
    border-radius:18px;
    outline:none;
    background:#fff;
    padding:0 24px;
    font-size:27px;
    color:#222;
    box-shadow:none;
}

#serviceSearch::placeholder{
    color:#777;
    opacity:1;
}

#serviceSearch:focus{
    border-color:#0052cc;
}

.total-services{
    margin-top:31px;
    font-size:27px;
    font-weight:800;
    color:#222;
}

.total-services span{
    color:#222;
}

/* =========================================================
   ===== MAIN SERVICE AREA ==================================
   ========================================================= */

.services-area{
    width:100%;
    padding:42px 20px 35px;
    background:linear-gradient(180deg,#edf5ff 0%,#f5f9ff 100%);
}

/* =========================================================
   ===== AADHAAR SERVICES PVC CARD ==========================
   ========================================================= */

.aadhaar-card{
    width:100%;
    max-width:650px;
    margin:0 auto;
    background:linear-gradient(135deg,#fafdff,#eef6ff);
    border-radius:28px;
    border-top:8px solid #ff9d3f;
    box-shadow:0 12px 30px rgba(0,82,204,.13);
    overflow:hidden;
    cursor:pointer;
    transition:transform .2s ease,box-shadow .2s ease;
}

.aadhaar-card:active{
    transform:scale(.99);
}

.aadhaar-card-header{
    min-height:235px;
    padding:38px 28px;
    display:flex;
    align-items:center;
    gap:24px;
}

.aadhaar-card-icon{
    width:94px;
    height:94px;
    border-radius:22px;
    background:linear-gradient(145deg,#f8fcff,#eaf3ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    color:#1678a2;
    box-shadow:0 8px 22px rgba(0,82,204,.10);
    flex-shrink:0;
}

.aadhaar-card-content{
    flex:1;
}

.aadhaar-card-content h2{
    color:#0052bd;
    font-size:31px;
    font-weight:800;
    margin-bottom:13px;
}

.aadhaar-card-content p{
    color:#666;
    font-size:23px;
    font-weight:700;
}

.aadhaar-card-arrow{
    color:#0052bd;
    font-size:39px;
    font-weight:900;
    transition:transform .25s ease;
}

.aadhaar-card.open .aadhaar-card-arrow{
    transform:rotate(180deg);
}

/* =========================================================
   ===== AADHAAR SERVICES LIST ==============================
   ========================================================= */

#aadhaarServices{
    display:none;
    width:100%;
    max-width:650px;
    margin:34px auto 0;
}

#aadhaarServices.show{
    display:block;
}

/* =========================================================
   ===== SERVICE CARD ========================================
   ========================================================= */

.service-card{
    width:100%;
    background:#fff;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    overflow:hidden;
}

.service-main-button{
    width:100%;
    min-height:88px;
    border:none;
    outline:none;
    background:#fff;
    color:#0052bd;
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:27px;
    font-weight:800;
    cursor:pointer;
    text-align:center;
}

.service-main-button:active{
    background:#f3f8ff;
}

.service-details{
    display:none;
    padding:20px;
    background:#fff;
}

.service-details.show{
    display:block;
}

/* =========================================================
   ===== INFORMATION TABLE ==================================
   ========================================================= */

.info-table{
    width:100%;
    border-collapse:collapse;
    margin:12px 0 20px;
    overflow:hidden;
    border-radius:10px;
}

.info-table th,
.info-table td{
    border:1px solid #d8e2ef;
    padding:12px 10px;
    font-size:15px;
    text-align:left;
    vertical-align:top;
}

.info-table th{
    background:#0052cc;
    color:#fff;
    font-weight:700;
}

.info-table td:first-child{
    width:42%;
    font-weight:700;
    color:#333;
}

.info-table td{
    color:#333;
}

/* =========================================================
   ===== APPLY / CHOICE BUTTONS =============================
   ========================================================= */

.apply-btn,
.choice-btn,
.apply{
    width:100%;
    border:2px solid #0052cc;
    background:#fff;
    color:#0052cc;
    border-radius:12px;
    padding:13px 16px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
}

.apply-btn:hover,
.choice-btn:hover,
.apply:hover{
    background:#0052cc;
    color:#fff;
}

.choice-panel{
    display:none;
    margin-top:15px;
}

.choice-panel.show{
    display:block;
}

.service-details h4{
    color:#0052cc;
    font-size:21px;
    margin-bottom:15px;
}

.service-details p{
    font-size:16px;
    line-height:1.55;
    margin-bottom:13px;
}

.service-details p strong{
    color:#333;
}

/* =========================================================
   ===== FORM OVERLAY ========================================
   ========================================================= */

.form-overlay{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.62);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:9999;
    overflow-y:auto;
}

.form-overlay.show{
    display:flex;
}

.form-box{
    width:100%;
    max-width:620px;
    max-height:94vh;
    overflow-y:auto;
    background:#fff;
    border-radius:18px;
    padding:22px;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.form-box h2{
    color:#0052cc;
    text-align:center;
    font-size:26px;
    margin-bottom:20px;
}

.form-box h3{
    color:#333;
    font-size:20px;
    margin-bottom:10px;
}

.form-box hr{
    border:0;
    border-top:1px solid #ddd;
    margin-bottom:18px;
}

.form-box label{
    display:block;
    font-size:16px;
    font-weight:700;
    color:#333;
    margin:14px 0 7px;
}

.required{
    color:#d00000;
    font-size:13px;
    font-weight:600;
}

.form-box input,
.form-box select{
    width:100%;
    min-height:48px;
    border:2px solid #cfd8e3;
    border-radius:9px;
    padding:10px 12px;
    outline:none;
    background:#fff;
    color:#222;
    font-size:16px;
}

.form-box input:focus,
.form-box select:focus{
    border-color:#0052cc;
}

.form-box input.error-field,
.form-box select.error-field{
    border-color:#d00000 !important;
    background:#fff7f7;
}

.error{
    color:#d00000;
    font-size:14px;
    font-weight:600;
    margin-top:5px;
    min-height:0;
}

.file-help{
    color:#666;
    font-size:13px;
    margin-top:7px;
    line-height:1.4;
}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.submit-btn,
.close-btn{
    flex:1;
    min-height:48px;
    border:none;
    border-radius:9px;
    padding:10px 15px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

.submit-btn{
    background:#0052cc;
    color:#fff;
}

.close-btn{
    background:#e5e5e5;
    color:#222;
}

/* =========================================================
   ===== RESPONSIVE ==========================================
   ========================================================= */

@media(max-width:600px){
    .header{
        min-height:174px;
        padding:10px 14px 20px;
    }

    .header-logo{
        width:82px;
        height:82px;
    }

    .header-name{
        font-size:17px;
        margin-bottom:11px;
    }

    .header-title{
        font-size:25px;
    }

    .main-intro{
        padding:27px 14px 22px;
    }

    .main-intro h1{
        font-size:38px;
    }

    .main-intro p{
        font-size:25px;
        margin-bottom:31px;
    }

    #serviceSearch{
        height:87px;
        font-size:25px;
        border-radius:18px;
    }

    .total-services{
        font-size:26px;
        margin-top:30px;
    }

    .services-area{
        padding:42px 20px 30px;
    }

    .aadhaar-card-header{
        min-height:235px;
        padding:34px 25px;
        gap:19px;
    }

    .aadhaar-card-icon{
        width:88px;
        height:88px;
        font-size:43px;
    }

    .aadhaar-card-content h2{
        font-size:29px;
    }

    .aadhaar-card-content p{
        font-size:21px;
    }

    .aadhaar-card-arrow{
        font-size:35px;
    }

    .service-main-button{
        min-height:86px;
        font-size:26px;
    }
}

@media(max-width:430px){
    .header-logo{
        width:78px;
        height:78px;
    }

    .header-title{
        font-size:23px;
    }

    .header-name{
        font-size:16px;
    }

    .main-intro h1{
        font-size:36px;
    }

    .main-intro p{
        font-size:23px;
    }

    #serviceSearch{
        font-size:23px;
    }

    .aadhaar-card-content h2{
        font-size:27px;
    }

    .aadhaar-card-content p{
        font-size:20px;
    }

    .service-main-button{
        font-size:24px;
    }
}
</style>

<!-- =========================================================
     ===== MAIN CSS : END ====================================
     ========================================================= -->

</head>

     ===== HEADER : START ====================================
     ========================================================= -->

<header class="header">

<img
class="header-logo"

class="header-logo"

<!-- =========================================================

<section class="main-intro">

</div>

</div>

</div>
