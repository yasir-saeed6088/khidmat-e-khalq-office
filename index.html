<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>KHIDMAT-E-KHALQ OFFICE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- =========================================================
     ===== MAIN CSS : START ==================================
     ========================================================= -->

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#f2f5fa;color:#222;min-height:100vh;width:100%;overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}

.header{width:100%;background:linear-gradient(135deg,#075bc7,#0047a8);color:#fff;padding:12px 18px 22px;box-shadow:0 5px 18px rgba(0,0,0,.18)}
.header-inner{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{width:108px;height:108px;border-radius:50%;object-fit:cover;background:#fff;flex-shrink:0}
.header-center{text-align:center;flex:1;min-width:0}
.header-name{font-size:17px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.header-title{font-size:29px;font-weight:800;white-space:nowrap}

.intro{width:100%;text-align:center;background:#fff;padding:27px 15px 22px}
.intro h1{font-size:34px;color:#075bc7;margin-bottom:17px}
.intro p{font-size:25px;margin-bottom:32px}
.search-box{width:94%;max-width:650px;margin:auto}
.search-box input{width:100%;height:88px;border:3px solid #0861c9;border-radius:18px;padding:0 24px;font-size:26px;outline:none;background:#fff}
.search-box input:focus{box-shadow:0 0 0 3px rgba(8,97,201,.12)}
.total-services{text-align:center;font-size:27px;font-weight:700;margin-top:32px}

.services-area{width:100%;max-width:none;margin:0;padding:40px 20px 55px;background:#f2f5fa}
.pvc-card{width:100%;max-width:900px;margin:0 auto 20px;background:linear-gradient(145deg,#f8fcff,#edf6ff);border-radius:25px;border-top:7px solid #ff9b32;padding:24px 25px;box-shadow:0 8px 25px rgba(0,82,204,.13)}
.pvc-head{display:flex;align-items:center;gap:20px;min-height:130px}
.pvc-icon{width:105px;height:105px;border-radius:24px;background:#f1f8ff;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 8px 22px rgba(0,82,204,.08);flex-shrink:0}
.pvc-text{flex:1;min-width:0}
.pvc-text h2{font-size:29px;color:#075bc7;margin-bottom:12px}
.pvc-text p{font-size:22px;font-weight:600;color:#666}
.pvc-arrow{font-size:35px;color:#075bc7;transition:.25s;flex-shrink:0}
.pvc-card.open .pvc-arrow{transform:rotate(180deg)}

.service-list{display:none;width:100%;max-width:900px;margin:0 auto}
.service-list.open{display:block}
.service-card{width:100%;background:#fff;border-radius:20px;margin:18px 0;box-shadow:0 3px 15px rgba(0,0,0,.07);overflow:hidden}
.service-title-btn{width:100%;border:0;background:#fff;padding:24px 22px;text-align:center;color:#075bc7;font-size:27px;font-weight:700;border-radius:20px}
.service-title-btn:hover{background:#f8fbff}

.service-details{display:none;background:#fff;padding:22px 20px 25px;border-top:1px solid #e4e9f0}
.service-details.open{display:block}
.service-details h3{text-align:center;color:#075bc7;font-size:28px;margin-bottom:20px}
.info-table{width:100%;border-collapse:collapse;margin-bottom:20px}
.info-table th,.info-table td{border:1px solid #d8dee8;padding:12px 10px;text-align:left;font-size:16px}
.info-table th{background:#075bc7;color:#fff}
.apply-btn,.apply{display:block;width:100%;border:0;border-radius:10px;background:#075bc7;color:#fff;padding:14px;font-weight:700;font-size:18px}
.apply-btn:hover,.apply:hover{background:#00499f}

.choice-panel{display:none;margin-top:18px;background:#fff;border:1px solid #dce4ef;border-radius:18px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.choice-panel.open{display:block}
.choice-panel h2{text-align:center;color:#075bc7;margin-bottom:18px}
.choice-btn{width:100%;padding:15px;border:3px solid #075bc7;background:#fff;color:#075bc7;border-radius:12px;font-weight:700;font-size:18px;margin-bottom:12px}
.choice-btn:last-child{margin-bottom:0}
.choice-btn:hover{background:#f1f7ff}

.form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:9999;padding:18px;overflow-y:auto}
.form-overlay.open{display:flex;align-items:center;justify-content:center}
.form-box{width:100%;max-width:650px;background:#fff;border-radius:18px;padding:25px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:94vh;overflow-y:auto}
.form-box h2{text-align:center;color:#075bc7;font-size:27px;margin-bottom:20px}
.form-box h3{font-size:21px;margin-bottom:10px}
.form-box hr{border:0;border-top:1px solid #ddd;margin-bottom:20px}
.form-box label{display:block;font-weight:700;margin:15px 0 7px}
.required{color:#d00;font-size:13px;font-weight:600}
.form-box input,.form-box select{width:100%;height:48px;border:1px solid #bbb;border-radius:8px;padding:0 12px;background:#fff;outline:none}
.form-box input:focus,.form-box select:focus{border-color:#075bc7}
.error{color:#d00000;font-size:13px;font-weight:600;min-height:18px;margin-top:4px}
.error-field{border:2px solid #d00000!important;background:#fff8f8!important}
.file-help{font-size:13px;color:#666;margin-top:8px}
.form-actions{display:flex;gap:12px;margin-top:24px}
.submit-btn,.close-btn{flex:1;border:0;border-radius:8px;padding:13px;font-weight:700;color:#fff}
.submit-btn{background:#075bc7}
.close-btn{background:#666}
.submit-btn:hover{background:#00499f}
.close-btn:hover{background:#444}

.footer{width:100%;background:#075bc7;color:#fff;text-align:center;padding:15px}
.footer p{margin:5px 0;font-size:15px}

.floating-contact{position:fixed;right:18px;bottom:85px;z-index:9000;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.need-help{background:#20a943;color:#fff;border:0;border-radius:30px;padding:14px 20px;font-size:19px;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.2);animation:helpMove 1.8s infinite}
.contact-icons{display:flex;flex-direction:column;gap:12px}
.contact-icon{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:31px;box-shadow:0 5px 15px rgba(0,0,0,.2)}
.whatsapp{background:#25d366}
.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}

@keyframes helpMove{
0%,100%{transform:translateX(0)}
50%{transform:translateX(-7px)}
}

.hidden{display:none!important}

@media(max-width:900px){
.pvc-card,.service-list{max-width:none}
}

@media(max-width:600px){
.logo{width:108px;height:108px}
.header-title{font-size:28px}
.header-name{font-size:16px}
.intro h1{font-size:34px}
.intro p{font-size:25px}
.search-box input{height:88px;font-size:24px}
.total-services{font-size:26px}
.services-area{padding:40px 20px}
.pvc-card{padding:24px 20px}
.pvc-head{min-height:120px}
.pvc-text h2{font-size:29px}
.service-title-btn{font-size:27px}
.form-box{padding:20px}
}

@media(max-width:430px){
.header{padding-left:10px;padding-right:10px}
.logo{width:108px;height:108px}
.header-title{font-size:28px}
.header-name{font-size:16px}
}
</style>

<!-- =========================================================
     ===== MAIN CSS : END ====================================
     ========================================================= -->

</head>
<body>

<!-- =========================================================
     ===== HEADER : START ====================================
     ========================================================= -->

<header class="header">
<div class="header-inner">
<img class="logo" src="Gemini_Generated_Image_vhcb6hvhcb6hvhcb.png" alt="Yasir Saeed Logo">
<div class="header-center">
<div class="header-name">YASIR SAEED</div>
<div class="header-title">KHIDMAT-E-KHALQ OFFICE</div>
</div>
<img class="logo" src="Gemini_Generated_Image_ngqq51ngqq51ngqq.png" alt="Khidmat-e-Khalq Office Logo">
</div>
</header>

<!-- =========================================================
     ===== HEADER : END ======================================
     ========================================================= -->

<!-- =========================================================
     ===== MAIN SERVICE INTRO : START ========================
     ========================================================= -->

<section class="intro">
<h1>Aadhaar Services Portal</h1>
<p>Fast • Secure • Professional</p>
<div class="search-box">
<input id="serviceSearch" type="search" placeholder="Search Aadhaar Service..." oninput="searchServices(this.value)">
</div>
<div class="total-services">Total Services : <span id="serviceCount">8</span></div>
</section>

<!-- =========================================================
     ===== MAIN SERVICE INTRO : END ==========================
     ========================================================= -->

<!-- =========================================================
     ===== AADHAAR PVC CARD BUTTON : START ===================
     ========================================================= -->

<main class="services-area">
<div id="aadhaarCard" class="pvc-card" onclick="toggleAadhaarServices()">
<div class="pvc-head">
<div class="pvc-icon">🪪</div>
<div class="pvc-text">
<h2>Aadhaar Services</h2>
<p>8 Services Available</p>
</div>
<div class="pvc-arrow">⌃</div>
</div>
</div>

<div id="aadhaarServicesList" class="service-list">
