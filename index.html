<!DOCTYPE html>
<html lang="en">
<head>

<!-- =========================================================
     ===== BASIC META =========================================
     ========================================================= -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>KHIDMAT-E-KHALQ OFFICE</title>

<!-- =========================================================
     ===== FONT AWESOME =======================================
     ========================================================= -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- =========================================================
     ===== MAIN CSS : START ==================================
     ========================================================= -->
<style>

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f2f6fb;
color:#222;
}

button,
input,
select,
textarea{
font-family:inherit;
}

button,
.apply,
.service-title{
-webkit-tap-highlight-color:transparent;
}

button{
touch-action:manipulation;
}

.header{
position:relative;
background:linear-gradient(135deg,#0052cc,#003b91);
color:white;
text-align:center;
padding:20px 100px 22px;
min-height:120px;
box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.header-logo{
width:78px;
height:78px;
object-fit:cover;
border-radius:50%;
position:absolute;
top:8px;
left:8px;
}

.header-logo-right{
width:78px;
height:78px;
object-fit:cover;
border-radius:50%;
position:absolute;
top:8px;
right:8px;
}

.header p{
margin:0;
font-size:16px;
font-weight:600;
letter-spacing:1px;
}

.header h1{
margin:8px 0 0;
font-size:25px;
}

.main-panel{
background:white;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.main-panel h2{
color:#0052cc;
text-align:center;
margin:0;
}

.tagline{
text-align:center;
margin:10px 0 0;
font-weight:500;
}

.search-box{
width:100%;
padding:14px;
margin-top:20px;
border:2px solid #0052cc;
border-radius:10px;
font-size:17px;
outline:none;
}

.search-box:focus{
box-shadow:0 0 0 3px rgba(0,82,204,.12);
}

.total-services{
text-align:center;
font-size:18px;
margin-top:18px;
}

.container{
width:100%;
max-width:700px;
margin:0 auto;
padding:5px 10px 100px;
}

.aadhaar-card-wrap{
width:100%;
max-width:400px;
margin:20px auto;
}

.aadhaar-card{
position:relative;
width:100%;
min-height:160px;
background:linear-gradient(135deg,#ffffff,#eef6ff);
border:1px solid #cfe0ff;
border-top:5px solid #ff9933;
border-radius:18px;
padding:18px;
cursor:pointer;
box-shadow:0 12px 30px rgba(0,82,204,.18);
transition:transform .2s,box-shadow .2s;
}

.aadhaar-card:active{
transform:scale(.98);
}

.aadhaar-card-row{
display:flex;
align-items:center;
width:100%;
}

.aadhaar-icon{
width:55px;
height:55px;
border-radius:13px;
background:#eef6ff;
display:flex;
align-items:center;
justify-content:center;
font-size:29px;
flex-shrink:0;
box-shadow:0 4px 10px rgba(0,82,204,.15);
}

.aadhaar-card-text{
flex:1;
margin-left:15px;
}

.aadhaar-card-text h2{
margin:0;
font-size:21px;
font-weight:700;
letter-spacing:.3px;
color:#0052cc;
}

.aadhaar-card-text p{
margin:6px 0 0;
color:#666;
font-size:14px;
font-weight:600;
}

.aadhaar-arrow{
font-size:30px;
color:#0052cc;
font-weight:bold;
margin-left:10px;
}

.service-content{
display:none;
}

.service-content.open{
display:block;
}

.service{
width:96%;
max-width:650px;
margin:12px auto;
}

.service-title{
background:white;
border:1px solid #d7e4f8;
border-radius:12px;
padding:15px;
color:#0052cc;
font-size:18px;
font-weight:700;
text-align:center;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,82,204,.1);
}

.service-title:active{
transform:scale(.99);
}

.service-details{
display:none;
background:#fff;
border:1px solid #dbe6f5;
border-radius:12px;
padding:15px;
margin-top:8px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.service-details.open{
display:block;
}

.service-details h2{
text-align:center;
color:#0052cc;
margin-top:0;
}

.info-table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

.info-table th,
.info-table td{
border:1px solid #d7d7d7;
padding:10px;
text-align:left;
vertical-align:top;
}

.info-table th{
background:#eef6ff;
color:#0052cc;
}

.apply{
display:block;
width:220px;
max-width:100%;
margin:20px auto 0;
padding:12px 18px;
background:#0052cc;
color:white;
text-align:center;
text-decoration:none;
border:none;
border-radius:8px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.apply:active{
transform:scale(.98);
}

.update-choice{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
margin:15px 0;
}

.choice-btn{
flex:1 1 200px;
padding:13px;
border:2px solid #0052cc;
background:white;
color:#0052cc;
border-radius:9px;
font-weight:700;
cursor:pointer;
}

.choice-btn.active{
background:#0052cc;
color:white;
}

.choice-panel{
display:none;
}

.choice-panel.open{
display:block;
}

.form-overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
overflow-y:auto;
z-index:9999;
padding:20px 0;
}

.form-overlay.open{
display:block;
}

.form-box{
position:relative;
background:white;
width:92%;
max-width:650px;
margin:20px auto;
padding:22px;
border-radius:14px;
max-height:calc(100vh - 40px);
overflow-y:auto;
box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.form-box h2{
text-align:center;
color:#0052cc;
margin-top:0;
}

.form-box h3{
color:#0052cc;
margin-top:22px;
}

.form-box label{
display:block;
font-weight:600;
margin-top:14px;
}

.required{
color:red;
}

.form-box input,
.form-box select,
.form-box textarea{
width:100%;
padding:11px;
margin-top:6px;
border:1px solid #bbb;
border-radius:7px;
font-size:16px;
background:white;
outline:none;
}

.form-box input:focus,
.form-box select:focus,
.form-box textarea:focus{
border-color:#0052cc;
box-shadow:0 0 0 2px rgba(0,82,204,.1);
}

.form-box textarea{
min-height:90px;
resize:vertical;
}

.error{
color:red;
font-size:13px;
margin-top:4px;
min-height:0;
}

.error.active{
margin-bottom:4px;
}

.file-help{
font-size:12px;
color:#666;
margin-top:5px;
}

.upload-row{
display:flex;
gap:8px;
align-items:center;
margin-top:8px;
}

.upload-row button{
background:#0052cc;
color:white;
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
}

.form-actions{
display:flex;
gap:10px;
justify-content:center;
margin-top:22px;
}

.submit-btn,
.close-btn{
border:none;
border-radius:7px;
padding:12px 25px;
font-weight:700;
font-size:15px;
cursor:pointer;
}

.submit-btn{
background:#28a745;
color:white;
}

.close-btn{
background:#dc3545;
color:white;
}

.footer{
position:relative;
background:#0052cc;
color:white;
text-align:center;
padding:25px 15px 80px;
margin-top:30px;
}

.footer p{
margin:8px 0;
}

.floating-contact{
position:fixed;
right:15px;
bottom:18px;
z-index:9000;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:8px;
}

.help-bubble{
background:white;
color:#0052cc;
padding:8px 12px;
border-radius:18px;
font-size:13px;
font-weight:700;
box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.float-btn{
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-decoration:none;
font-size:25px;
box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.whatsapp{
background:#25d366;
}

.instagram{
background:#1258d6;
}

.bottom-blue-bar{
height:8px;
width:100%;
background:#0052cc;
}

.hidden{
display:none!important;
}

@media(max-width:600px){

.header{
padding:17px 75px 18px;
min-height:105px;
}

.header-logo,
.header-logo-right{
width:65px;
height:65px;
top:8px;
}

.header h1{
font-size:19px;
}

.header p{
font-size:13px;
}

.main-panel{
padding:16px 12px;
}

.aadhaar-card{
min-height:145px;
}

.aadhaar-card-text h2{
font-size:18px;
}

.info-table th,
.info-table td{
font-size:13px;
padding:8px;
}

.form-box{
width:94%;
padding:18px;
}

.form-actions{
flex-wrap:wrap;
}

.submit-btn,
.close-btn{
flex:1 1 120px;
}

}

</style>
<!-- =========================================================
     ===== MAIN CSS : END ====================================
     ========================================================= -->
     
</head>

<!-- =========================================================

     ========================================================= -->

<section class="main-intro">

<p>Fast • Secure • Professional</p>

<input
type="search"
id="serviceSearch"

</div>

</button>

</section>
