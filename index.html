<!DOCTYPE html>
<html lang="en">
<head>

<!-- =========================================================
     ===== BASIC META =========================================
     ========================================================= -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>KHIDMAT-E-KHALQ OFFICE</title>

<!-- =========================================================
     ===== FONT AWESOME =======================================
     ========================================================= -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- =========================================================
     ===== MAIN CSS : START ==================================
     ========================================================= -->

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222;overflow-x:hidden}
button,input{font-family:inherit}
.header{background:linear-gradient(135deg,#0756c9,#0047b3);min-height:165px;padding:12px 8px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}
.logo{width:65px;height:65px;border-radius:50%;object-fit:cover;background:#fff;flex-shrink:0;align-self:flex-start;margin-top:-5px}
.header .logo:first-child{transform:translateX(-7px)}
.header .logo:last-child{transform:translateX(7px)}
.header-center{text-align:center;flex:1;min-width:0}
.header-center .name{font-size:20px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.header-center h1{font-size:28px;line-height:1.2;font-weight:800;white-space:nowrap}
.main-intro{text-align:center;padding:26px 20px 28px;background:#fff}
.main-intro h2{font-size:38px;color:#0758c9;font-weight:800;margin-bottom:18px}
.main-intro p{font-size:25px;font-weight:600;color:#222;letter-spacing:.3px}
.search-box{margin:30px auto 28px;max-width:650px}
.search-box input{width:100%;height:88px;border:3px solid #0960c9;border-radius:18px;padding:0 24px;font-size:24px;outline:none}
.search-box input::placeholder{color:#777}
.total-services{font-size:25px;font-weight:700;margin-top:5px}
.total-services span{font-weight:400}
.aadhaar-section{background:#eef5fd;padding:40px 18px 35px}
.aadhaar-toggle{width:100%;max-width:700px;margin:0 auto;background:linear-gradient(145deg,#f8fbff,#edf5fc);border:0;border-top:7px solid #ff9d35;border-radius:28px;min-height:235px;padding:35px 28px;display:flex;align-items:center;gap:24px;text-align:left;box-shadow:0 12px 28px rgba(0,82,204,.12);cursor:pointer}
.aadhaar-icon{width:95px;height:95px;border-radius:22px;background:#f5faff;display:flex;align-items:center;justify-content:center;font-size:55px;box-shadow:0 8px 22px rgba(0,82,204,.10);flex-shrink:0}
.aadhaar-text{flex:1}
.aadhaar-text h3{font-size:30px;color:#0758c9;margin-bottom:10px}
.aadhaar-text p{font-size:21px;color:#555;font-weight:600}
.aadhaar-arrow{font-size:35px;color:#0758c9;font-weight:800}
@media(max-width:600px){
.header{min-height:165px;padding:10px 12px 18px}
.logo{width:65px;height:65px}
.header-center .name{font-size:17px;margin-bottom:8px}
.header-center h1{font-size:27px;white-space:normal}
.main-intro{padding:26px 18px}
.main-intro h2{font-size:36px;line-height:1.15}
.main-intro p{font-size:24px}
.search-box{margin:30px auto 28px}
.search-box input{height:88px;font-size:24px;border-radius:18px}
.total-services{font-size:24px}
.aadhaar-section{padding:40px 18px 30px}
.aadhaar-toggle{min-height:235px;padding:30px 20px;border-radius:28px;gap:18px}
.aadhaar-icon{width:82px;height:82px;font-size:46px}
.aadhaar-text h3{font-size:28px}
.aadhaar-text p{font-size:20px}
.aadhaar-arrow{font-size:32px}
}
</style>

<!-- =========================================================
     ===== MAIN CSS : END ====================================
     ========================================================= -->
     
</head>
<body>

<!-- =========================================================
     ===== HEADER : START ====================================
     ========================================================= -->

<header class="header">

<img
src="Gemini_Generated_Image_vhcb6hvhcb6hvhcb.png"
alt="Yasir Saeed Logo"
class="logo">

<div class="header-center">
<div class="name">YASIR SAEED</div>
<h1>KHIDMAT-E-KHALQ OFFICE</h1>
</div>

<img
src="Gemini_Generated_Image_ngqq51ngqq51ngqq.png"
alt="Khidmat-E-Khalq Office Logo"
class="logo">

</header>

<!-- =========================================================
     ===== HEADER : END ======================================
     ========================================================= -->


<!-- =========================================================
     ===== MAIN SERVICE INTRO : START ========================
     ========================================================= -->

<section class="main-intro">

<h2>Aadhaar Services Portal</h2>

<p>Fast • Secure • Professional</p>

<div class="search-box">
<input
type="search"
id="serviceSearch"
placeholder="Search Aadhaar Service..."
autocomplete="off">
</div>

<div class="total-services">
Total Services : <span>8</span>
</div>

</section>

<!-- =========================================================
     ===== MAIN SERVICE INTRO : END ==========================
     ========================================================= -->


<!-- =========================================================
     ===== AADHAAR PVC CARD BUTTON : START ===================
     ========================================================= -->

<section class="aadhaar-section">

<button
type="button"
class="aadhaar-toggle"
id="aadhaarServicesButton">

<div class="aadhaar-icon">🪪</div>

<div class="aadhaar-text">
<h3>Aadhaar Services</h3>
<p>8 Services Available</p>
</div>

<div class="aadhaar-arrow">⌃</div>

</button>

</section>

<!-- =========================================================
     ===== AADHAAR PVC CARD BUTTON : END =====================
     ========================================================= -->
